# For local testing only.
services:
  # Antosara Auth Service
  antosara-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antosara-auth-service
    ports:
      - "5000:5000"
    environment:
      - AWS_PROFILE=
      - AWS_REGION=
      - AWS_SECRET_ARN=
      # Local dev: use credentials from mounted ~/.aws.
      - AWS_SHARED_CREDENTIALS_FILE=/app/.aws/credentials
      - AWS_CONFIG_FILE=/app/.aws/config
    volumes:
      # Local dev: mount host AWS config. In production omit this and use env_file or env with credentials.
      - ~/.aws:/app/.aws:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - antosara-network

networks:
  antosara-network:
    driver: bridge
