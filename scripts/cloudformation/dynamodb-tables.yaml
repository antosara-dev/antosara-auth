AWSTemplateFormatVersion: '2010-09-09'
Description: 'DynamoDB tables for antosara-auth service'

Parameters:
  Environment:
    Type: String
    Default: production
    Description: Environment name (e.g., production, staging, development)

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: Email
          AttributeType: S
        - AttributeName: ResetToken
          AttributeType: S
      KeySchema:
        - AttributeName: Email
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ResetTokenIndex
          KeySchema:
            - AttributeName: ResetToken
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Service
          Value: antosara-auth
        - Key: Table
          Value: Users
        - Key: Environment
          Value: !Ref Environment

  RevokedTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RevokedTokens
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: JTI
          AttributeType: S
      KeySchema:
        - AttributeName: JTI
          KeyType: HASH
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Service
          Value: antosara-auth
        - Key: Table
          Value: RevokedTokens
        - Key: Environment
          Value: !Ref Environment

  SessionCSRFTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SessionCSRF
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: JTI
          AttributeType: S
      KeySchema:
        - AttributeName: JTI
          KeyType: HASH
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Service
          Value: antosara-auth
        - Key: Table
          Value: SessionCSRF
        - Key: Environment
          Value: !Ref Environment

Outputs:
  UsersTableName:
    Description: Name of the Users table
    Value: !Ref UsersTable
    Export:
      Name: !Sub '${AWS::StackName}-UsersTable'

  RevokedTokensTableName:
    Description: Name of the RevokedTokens table
    Value: !Ref RevokedTokensTable
    Export:
      Name: !Sub '${AWS::StackName}-RevokedTokensTable'

  SessionCSRFTableName:
    Description: Name of the SessionCSRF table
    Value: !Ref SessionCSRFTable
    Export:
      Name: !Sub '${AWS::StackName}-SessionCSRFTable'
