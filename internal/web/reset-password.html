<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="stylesheet" href="{{ASSET_BASE}}/reset-password.css">
</head>
<body>
  <main>
    <h1>Reset Password</h1>
    <p class="hint">Local development page for testing password reset.</p>

    <form id="reset-form">
      <input type="hidden" name="token" id="token" value="{{TOKEN}}">
      <label for="password">New password</label>
      <input type="password" id="password" name="password" required autocomplete="new-password">
      <button type="submit" id="submit-btn">Reset password</button>
    </form>

    <p id="message" class="message" hidden role="status"></p>
  </main>
  <script src="{{ASSET_BASE}}/reset-password.js"></script>
</body>
</html>
