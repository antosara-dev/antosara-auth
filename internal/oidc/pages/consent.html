<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorize</title>
  <link rel="stylesheet" href="/oidc-idp/consent.css">
</head>
<body>
  <main>
    <h1>Authorize application</h1>
    <p class="hint"><strong>{{CLIENT_ID}}</strong> is requesting access to your account.</p>
    {{ERROR}}
    <p>Requested permissions:</p>
    <ul class="scopes">{{SCOPES}}</ul>
    <form id="consent-form" method="post" action="/oidc-idp/consent">
      <input type="hidden" name="csrf" value="{{CSRF}}">
      <input type="hidden" name="decision" id="decision" value="">
      <div class="actions">
        <button type="submit" value="allow" id="allow-btn">Allow</button>
        <button type="submit" value="deny" class="secondary" id="deny-btn">Deny</button>
      </div>
    </form>
  </main>
  <script src="/oidc-idp/consent.js"></script>
</body>
</html>
