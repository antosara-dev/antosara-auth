<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <link rel="stylesheet" href="/oidc-idp/login.css">
</head>
<body>
  <main>
    <h1>Sign in</h1>
    <p class="hint">Sign in to continue to {{CLIENT_ID}}</p>
    {{ERROR}}
    <form id="login-form" method="post" action="/oidc-idp/login">
      <input type="hidden" name="csrf" value="{{CSRF}}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username" value="{{EMAIL}}">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
  </main>
  <script src="/oidc-idp/login.js"></script>
</body>
</html>
